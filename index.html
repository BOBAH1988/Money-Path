<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-new-16.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#007aff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Денежный путь" />
    <title>Денежный путь</title>
    <link rel="manifest" href="./manifest.json?v=8" />
    <link rel="apple-touch-icon" href="./icons/app-icon-new-16-180.png" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; height: 100%; }
      html { background: #f5f5f7; color-scheme: light; }
      html.dark { background: #0f172a; color-scheme: dark; }
      body { font-family: system-ui, -apple-system, sans-serif; background: inherit; }
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        gap: 16px;
        background: #f5f5f7;
        color: #1d1d1f;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.12s ease;
      }
      html.dark .app-loader {
        background: #0f172a;
        color: #f5f5f7;
      }
      .app-loader-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #007aff, #5856d6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 8px 24px rgba(0, 122, 255, 0.25);
      }
      .app-loader-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(0, 122, 255, 0.2);
        border-top-color: #007aff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      html.dark .app-loader-spinner {
        border-color: rgba(56, 189, 248, 0.25);
        border-top-color: #38bdf8;
      }
      .app-loader-text {
        font-size: 14px;
        opacity: 0.65;
        letter-spacing: 0.01em;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function() {
        var saved = localStorage.getItem('denegnyj_put_theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0f172a');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" id="app-loader">
        <div class="app-loader-icon">₽</div>
        <div class="app-loader-spinner" aria-hidden="true"></div>
        <div class="app-loader-text">Загрузка…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
