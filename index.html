<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#007aff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="theme-color" content="#007aff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Денежный путь" />
    <title>Денежный путь</title>
    <link rel="manifest" href="./manifest.json?v=8" />
    <link rel="apple-touch-icon" href="./icons/app-icon-180.png" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; height: 100%; }
      html { background: #f5f5f7; color-scheme: light; }
      html.dark { background: #0f172a; color-scheme: dark; }
      body { font-family: system-ui, -apple-system, sans-serif; background: inherit; }

      /* Загрузчик до первого рендера React: иконка сайта и полоса загрузки */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        background: #f5f5f7;
        color: #1d1d1f;
        z-index: 9999;
        transition: opacity 0.18s ease;
      }
      html.dark .app-loader {
        background: #0f172a;
        color: #f5f5f7;
      }

      .app-loader-icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
        animation: app-icon-pulse 2.4s ease-in-out infinite;
      }
      .app-loader-icon img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .app-loader-bar {
        width: 148px;
        height: 4px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.12);
        overflow: hidden;
      }
      html.dark .app-loader-bar {
        background: rgba(248, 250, 252, 0.16);
      }
      .app-loader-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #10b981);
        animation: app-bar-slide 1.1s ease-in-out infinite;
      }

      .app-loader-text {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }

      @keyframes app-bar-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @keyframes app-icon-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-icon, .app-loader-bar::after { animation: none; }
      }
    </style>
    <script>
      (function() {
        var saved = localStorage.getItem('denegnyj_put_theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
        var metas = document.querySelectorAll('meta[name="theme-color"]:not([media])');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', dark ? '#0f172a' : '#007aff');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="app-loader" id="app-loader" role="status" aria-live="polite">
      <div class="app-loader-icon">
        <img src="./app-icon.svg" alt="" width="72" height="72" />
      </div>
      <div class="app-loader-bar" aria-hidden="true"></div>
      <div class="app-loader-text">Загрузка…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
