<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#007aff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Денежный путь" />
    <title>Денежный путь</title>
    <link rel="manifest" href="./manifest.json?v=8" />
    <link rel="apple-touch-icon" href="./icons/app-icon-180.png" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; height: 100%; }
      html { background: #f5f5f7; color-scheme: light; }
      html.dark { background: #0f172a; color-scheme: dark; }
      body { font-family: system-ui, -apple-system, sans-serif; background: inherit; }

      /* Modern top loader with site icon */
      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 64px;
        padding: 0 28px;
        background: var(--theme-bg, #f5f5f7);
        color: var(--theme-text, #1d1d1f);
        z-index: 9999;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
        transition: box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
      }
      html.dark .app-loader {
        background: var(--theme-bg, #0f172a);
        color: var(--theme-text, #f5f5f7);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35), 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      .app-loader-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--dp-color-primary, #007aff), var(--dp-color-primary-hover, #5856d6));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35);
        position: relative;
        flex-shrink: 0;
        overflow: hidden;
        transition: background 0.3s ease, box-shadow 0.3s ease;
      }
      html.dark .app-loader-icon {
        background: linear-gradient(135deg, var(--dp-color-primary, #38bdf8), var(--dp-color-primary-hover, #0ea5e9));
        box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      }
      .app-loader-icon-img {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }

      .app-loader-spinner {
        width: 22px;
        height: 22px;
        border: 3px solid var(--dp-color-primary, #007aff);
        borderTop-color: transparent;
        borderRadius: 50%;
        animation: app-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      html.dark .app-loader-spinner {
        border-color: var(--dp-color-primary, #38bdf8);
        borderTop-color: transparent;
      }

      .app-loader-text {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--dp-color-text, var(--theme-text, #1d1d1f));
        opacity: 0.85;
      }
      html.dark .app-loader-text {
        color: var(--dp-color-text, var(--theme-text, #f5f5f7));
      }

      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      .app-loader-icon {
        animation: app-icon-pulse 2.4s ease-in-out infinite;
      }
      @keyframes app-icon-pulse {
        0%, 100% { box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35); transform: scale(1); }
        50% { box-shadow: 0 4px 22px rgba(0, 122, 255, 0.5); transform: scale(1.06); }
      }
      html.dark .app-loader-icon {
        animation: app-icon-pulse 2.4s ease-in-out infinite;
      }
      @keyframes app-icon-pulse {
        0%, 100% { box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4); transform: scale(1); }
        50% { box-shadow: 0 4px 22px rgba(56, 189, 248, 0.55); transform: scale(1.06); }
      }
    </style>
    <script>
      (function() {
        var saved = localStorage.getItem('denegnyj_put_theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0f172a');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
