<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gPath" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gCoin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="28%" stop-color="#ffd54a"/>
      <stop offset="55%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gCoinTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="100%" stop-color="#f2b431"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a4b06"/>
      <stop offset="100%" stop-color="#6b3504"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#gBg2)"/>

  <!-- три восходящие ступени-точки пути -->
  <rect x="112" y="312" width="72" height="112" rx="24" fill="#2563eb"/>
  <rect x="220" y="248" width="72" height="176" rx="24" fill="#3b82f6"/>
  <rect x="328" y="184" width="72" height="240" rx="24" fill="#10b981"/>

  <!-- восходящая траектория -->
  <path d="M148 292 L256 228 L364 164" fill="none" stroke="url(#gPath)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- золотая монета на вершине пути: боковина (толщина) + лицевая сторона -->
  <g>
    <ellipse cx="364" cy="158" rx="54" ry="54" fill="url(#gRim)"/>
    <ellipse cx="364" cy="150" rx="54" ry="54" fill="url(#gCoin)"/>
    <ellipse cx="364" cy="150" rx="43" ry="43" fill="none" stroke="#a86506" stroke-width="4" opacity="0.55"/>
    <ellipse cx="364" cy="150" rx="34" ry="34" fill="url(#gCoinTop)"/>
    <!-- блик -->
    <ellipse cx="344" cy="126" rx="18" ry="10" fill="#ffffff" opacity="0.5" transform="rotate(-32 344 126)"/>
    <!-- знак рубля: чаша P, вертикаль, перекладина -->
    <g fill="none" stroke="#7a4205" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <path d="M354 128 v44"/>
      <path d="M354 128 h13 a11 11 0 0 1 0 22 h-13"/>
      <path d="M346 152 h26"/>
    </g>
  </g>
</svg>
